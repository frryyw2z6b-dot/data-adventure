<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#2b2347" />
    <meta name="description" content="لعبة تعليمية ثلاثية الأبعاد لوحدة تمثيل البيانات — الصف الثاني الابتدائي" />
    <title>مغامرة مستكشفي البيانات</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M8 56h48L32 8z' fill='%23c99567'/%3E%3Cpath d='M24 56h16L32 40z' fill='%233b2216'/%3E%3C/svg%3E" />
  </head>
  <body class="game">
    <canvas id="scene" aria-label="مشهد المغامرة ثلاثي الأبعاد"></canvas>

    <div id="letterbox" aria-hidden="true"><i class="top"></i><i class="bottom"></i></div>
    <div id="title-card" aria-live="polite"></div>

    <header id="hud" hidden>
      <button class="btn icon" data-home aria-label="العودة إلى الخريطة"></button>
      <div class="hud-center">
        <p class="stage-name"></p>
        <div class="dots" aria-label="تقدّم الأسئلة"></div>
      </div>
      <span class="draft" hidden title="هذه الأسئلة للتجربة حتى تُراجَع مع الكتاب">أسئلة تجريبية</span>
    </header>
    <button id="sound-btn" class="btn icon" aria-label="الصوت"></button>

    <div id="prompt" class="prompt" hidden aria-live="polite"></div>
    <div id="choices" class="choices" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <p id="rotate-hint">أديري الجهاز أفقيًا لتكبير المشهد ↻</p>

    <main id="screens" hidden></main>
    <div id="mode-badge" hidden></div>

    <div id="loading">
      <div class="loader"><i></i><i></i><i></i></div>
      <p>نجهّز الواحة…</p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
